<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Dicas, estratégias e guias multilíngues para Total Battle.">
    <title>Total Battle — Dicas e Truques</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <header class="hero">
      <nav class="nav container" data-i18n-aria-label="ui.mainNavigation">
        <a class="brand" href="#inicio">Total Battle</a>
        <div class="nav-actions">
          <a class="nav-link" href="#dicas" data-i18n="ui.navTips">Dicas</a>
          <div class="language-picker" role="group" aria-label="Idioma" data-i18n-aria-label="ui.languageLabel">
            <button type="button" data-locale="pt-BR" aria-pressed="false" lang="pt-BR">PT</button>
            <button type="button" data-locale="en" aria-pressed="false" lang="en">EN</button>
            <button type="button" data-locale="es" aria-pressed="false" lang="es">ES</button>
            <button type="button" data-locale="fr" aria-pressed="false" lang="fr">FR</button>
            <button type="button" data-locale="de" aria-pressed="false" lang="de">DE</button>
            <button type="button" data-locale="ru" aria-pressed="false" lang="ru">RU</button>
            <button type="button" data-locale="pl" aria-pressed="false" lang="pl">PL</button>
          </div>
        </div>
      </nav>

      <div id="inicio" class="hero-content container">
        <p class="eyebrow" data-i18n="ui.heroEyebrow">Guia comunitário multilíngue</p>
        <h1><span data-i18n="ui.heroTitleLine1">Construa melhor.</span><br><span data-i18n="ui.heroTitleLine2">Combata com estratégia.</span></h1>
        <p class="intro" data-i18n="ui.intro">Um ponto de encontro para dicas, truques e guias de Total Battle.</p>
        <a class="button" href="#dicas" data-i18n="ui.cta">Ver primeiras dicas</a>
      </div>
    </header>

    <main>
      <section id="dicas" class="tips container" aria-labelledby="tips-title">
        <div class="section-heading">
          <p class="eyebrow" data-i18n="ui.sectionEyebrow">Comece por aqui</p>
          <h2 id="tips-title" data-i18n="ui.sectionTitle">Fundamentos para evoluir</h2>
        </div>

        <p id="tips-status" class="status" role="status" data-i18n="ui.loading">Carregando dicas…</p>
        <div id="tips-list" class="card-grid"></div>
      </section>
    </main>

    <footer>
      <div class="container footer-content">
        <p data-i18n="ui.footerNotice">Projeto independente feito pela comunidade.</p>
        <p><a href="LICENSE">Apache 2.0</a> · <span id="year"></span></p>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
